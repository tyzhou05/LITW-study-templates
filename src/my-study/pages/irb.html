<h3 class="bolded-blue" data-i18n='litw-irb2-header'></h3>

<div class="container-fluid px-4">
    <div class="row">
        <div class="col-md-32 mx-auto">
            <div style="max-width: 1200px; margin: 0 auto;">
                <h5 class="bolded-blue" data-i18n="litw-irb2-q1" style="margin-top: 30px;"></h5>
                <p data-i18n="litw-irb2-a1-p1"></p>
                <p data-i18n="litw-irb2-a1-p2"></p>
                <p data-i18n="litw-irb2-a1-p3"></p>

                <h5 class="bolded-blue" style="margin-top: 30px;" data-i18n="litw-irb2-q2"></h5>
                <p data-i18n="litw-irb2-a2"></p>
                <ul style="margin-left: 20px;">
                    <li>How visually appealing it is.</li>
                    <li>How likely you would be to click on it.</li>
                    <li>How creative you feel the design is.</li>
                    <li>How weird you feel the design is.</li>
                </ul>
                <p>Please see an example preview below.</p>

                <div class="text-center" style="margin: 30px 0;">
                    <img src="./img/sample.png" class="img-fluid" alt="Sample Advertisement" 
                         style="max-height: 400px; 
                                width: auto;
                                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                                border-radius: 4px;">
                </div>

                <h5 class="bolded-blue" style="margin-top: 30px;" data-i18n="litw-irb2-q3"></h5>
                <p data-i18n="litw-irb2-a3"></p>

                <h5 class="bolded-blue" style="margin-top: 30px;" data-i18n="litw-irb2-q4"></h5>
                <p data-i18n="litw-irb2-a4-p1"></p>
                <p data-i18n="litw-irb2-a4-p2"></p>

                <div style="margin-top: 40px;">
                    <form id="consent-form">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="agree-to-study" onclick="checkBoxVerification()">
                            <label class="form-check-label" for="agree-to-study" data-i18n='litw-irb2-consent'></label>
                        </div>
                    </form>
                    <span class="bolded-blue" id="approve-irb" data-i18n='litw-irb-warning'></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var checkBoxVerification = function() {
        if($('#agree-to-study').is(':checked')) {
            $('#approve-irb').hide();
            $('#btn-next-page').attr('style', 'display:block;');
            $('#btn-next-page')[0].scrollIntoView();
        } else {
            $('#btn-next-page').hide();
            $('#approve-irb').attr('style', 'display:block;');
        }
    }
</script>
