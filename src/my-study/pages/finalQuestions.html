<script type="text/javascript">
    if (!window.finalQuestionsInitialized) {
        window.finalQuestionsInitialized = true;
        window.selectionData = {};

        window.checkAllResponses = function() {
            const hasAllResponses = 
                typeof window.selectionData.ai_estimate !== 'undefined' &&
                typeof window.selectionData.ai_comfort !== 'undefined' &&
                typeof window.selectionData.ai_familiar !== 'undefined';

            if (hasAllResponses) {
                LITW.utils.showNextButton();
            } else {
                LITW.utils.hideNextButton();
            }
            return hasAllResponses;
        }

        window.selection = function(buttonID, questionType) {
            let clickedElem = document.getElementById(buttonID);
            if(clickedElem) {
                // Remove active class from all buttons in the same group
                clickedElem.parentElement.querySelectorAll('.btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                clickedElem.classList.add('active');
                
                window.selectionData[questionType] = clickedElem.dataset.response_id;
                window.checkAllResponses();
            }
        }

        window.resetSelections = function() {
            window.selectionData = {};
            document.querySelectorAll('.btn-outline-primary').forEach(btn => {
                btn.classList.remove('active');
            });
            window.checkAllResponses();
        }

        document.removeEventListener('DOMContentLoaded', window.resetSelections);
        document.removeEventListener('template-display', window.resetSelections);
        document.addEventListener('DOMContentLoaded', window.resetSelections);
        document.addEventListener('template-display', window.resetSelections);
        window.resetSelections();
    } else {
        window.resetSelections();
    }
</script>
