<div class="row">
    <div class="col d-flex justify-content-center">
        <h2 class="bolded-blue" data-i18n="litw-demographics-title"></h2>
        <span class="info-tooltip" data-i18n="litw-demographics-title-tip-text">
            <span class="tooltiptext" data-i18n="litw-demographics-title-tip"></span>
        </span>
    </div>
</div>

<div class="row">
    <div class="col">
        <p data-i18n="litw-demographics-required"></p>
    </div>
</div>

<form id="demographicsForm">
    <div class="form-group mb-4">
        <label data-i18n="litw-demographics-retake"></label>
        <div class="form-check">
            <input type="radio" name="retake" value="yes" required>
            <label data-i18n="litw-demographics-yes"></label>
        </div>
        <div class="form-check">
            <input type="radio" name="retake" value="no">
            <label data-i18n="litw-demographics-no"></label>
        </div>
        <div class="form-check">
            <input type="radio" name="retake" value="unsure">
            <label data-i18n="litw-demographics-unsure"></label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label data-i18n="litw-demographics-country-grow"></label>
        <input type="text" class="form-control" name="country_grow" required>
    </div>

    <div class="form-group mb-4">
        <label data-i18n="litw-demographics-country-live"></label>
        <input type="text" class="form-control" name="country_live" required>
    </div>

    <div class="form-group mb-4">
        <label data-i18n="litw-demographics-age"></label>
        <input type="number" class="form-control" name="age" required min="14">
    </div>

    <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary" data-i18n="litw-demographics-continue"></button>
    </div>
</form>
